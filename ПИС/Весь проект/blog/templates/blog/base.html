{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Блог{% endblock %}</title>

    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="{% static 'css/style2.css' %}">
</head>

<body>

<!-- Параллакс -->
<div class="parallax"></div>

<header>
    <div class="logo">
        <img src="{% static 'img/logo2.png' %}" alt="Логотип">
        <span class="logo-text">Блог</span>
    </div>

    <nav>
        <a href="/">Главная</a>

        {% if user.is_authenticated %}
            <a href="/post/new/">Создать пост</a>

            <form action="/accounts/logout/" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="/accounts/login/">Войти</a>
            <a href="/accounts/register/">Регистрация</a>
        {% endif %}
    </nav>
</header>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.post-card').forEach(card => {
        const body = card.querySelector('.post-body');

        // Клик — разворачивает/сворачивает
        card.addEventListener('click', () => {
            if (body.style.display === 'block') {
                body.style.display = 'none';
            } else {
                body.style.display = 'block';
            }
        });

        // Наведение — меняет цвет и поднимает
        card.addEventListener('mouseenter', () => {
            card.classList.add('hovered');
        });

        card.addEventListener('mouseleave', () => {
            card.classList.remove('hovered');
        });
    });
});
</script>


</body>
</html>
