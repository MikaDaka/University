{% extends 'blog/base.html' %}

{% block content %}
<h2>Все посты</h2>

{% for post in posts %}
<div class="post-card">
    <div class="post-title">
        {{ post.title }} — {{ post.created_date|date:"d.m.Y H:i" }}
    </div>

    <div class="post-body">
        <p>{{ post.text|linebreaks }}</p>
        <a href="{% url 'post_detail' post.pk %}">Открыть полностью</a>
        <p><small>Автор: {{ post.author.username }}</small></p>
    </div>
</div>
{% empty %}
<p>Постов пока нет.</p>
{% endfor %}
{% endblock %}
